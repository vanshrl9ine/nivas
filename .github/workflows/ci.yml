name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A new push supersedes an in-flight run on the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Testcontainers reuse is a local developer convenience; on a fresh CI runner
  # it only adds noise to the logs.
  TESTCONTAINERS_REUSE_ENABLE: "false"

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      # Elasticsearch will not start under the default limit.
      - name: Raise vm.max_map_count for Elasticsearch
        run: sudo sysctl -w vm.max_map_count=262144

      - name: Compile
        working-directory: nivas-api
        run: ./mvnw -B -ntp -DskipTests compile

      - name: Unit tests
        working-directory: nivas-api
        run: ./mvnw -B -ntp test

      # Runs the *IT classes against real Postgres, Redis, Elasticsearch and
      # Kafka containers.
      #
      # NIVAS_REQUIRE_DOCKER turns an unreachable daemon into a failure instead
      # of a skip. Without it a misconfigured runner skips all 19 integration
      # tests and still reports BUILD SUCCESS — which is exactly what happened
      # the first time this suite was run for real.
      - name: Integration tests
        working-directory: nivas-api
        run: ./mvnw -B -ntp verify
        env:
          NIVAS_REQUIRE_DOCKER: "true"

      # Belt and braces: assert the suite actually executed. A future change to
      # the skip logic should not be able to quietly hollow out CI.
      - name: Assert integration tests ran
        working-directory: nivas-api
        run: |
          reports=target/failsafe-reports
          if [ ! -d "$reports" ]; then
            echo "No failsafe reports — integration tests did not run at all."
            exit 1
          fi
          skipped=$(grep -ho 'skipped="[0-9]*"' "$reports"/*.xml | grep -o '[0-9]*' | paste -sd+ - | bc)
          run=$(grep -ho 'tests="[0-9]*"' "$reports"/*.xml | grep -o '[0-9]*' | paste -sd+ - | bc)
          echo "integration tests: $run run, $skipped skipped"
          if [ "$run" -eq 0 ] || [ "$skipped" -eq "$run" ]; then
            echo "Every integration test was skipped. Failing."
            exit 1
          fi

      - name: Package
        working-directory: nivas-api
        run: ./mvnw -B -ntp -DskipTests package

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            nivas-api/target/surefire-reports/
            nivas-api/target/failsafe-reports/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: nivas-api-jar
          path: nivas-api/target/*.jar
          retention-days: 7

  compose:
    name: Validate compose stack
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # Catches malformed YAML, unknown keys and bad interpolation before anyone
      # discovers them halfway through a `compose up`.
      - name: Validate docker-compose.yml
        run: docker compose -f infra/docker-compose.yml config --quiet

      - name: Validate observability profile resolves
        run: |
          docker compose -f infra/docker-compose.yml --profile observability --profile tools \
            config --quiet
